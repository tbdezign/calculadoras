<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TBDezign Apparel Quotes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0f0f0; color: #051024; min-height: 100vh; padding: 24px 16px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: #999; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 12px; border: 1px solid #E8E8E8; }
  .card-label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; }
  .field { flex: 1; }
  .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'SF Mono','Fira Code',monospace; text-align: center; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: #1a7698; box-shadow: 0 0 0 3px rgba(65,169,204,0.18); }
  .hint { font-size: 11px; color: #999; margin-top: 6px; font-family: 'SF Mono','Fira Code',monospace; }
  .hint-right { text-align: right; }
  .btn-group { display: flex; gap: 6px; }
  .btn { flex: 1; padding: 10px 0; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; background: #F0F0F0; color: #666; font-family: inherit; }
  .btn:hover { background: #E0E0E0; }
  .btn.active { background: #051024; color: #fff; }
  .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .info-row span { font-size: 12px; color: #999; }
  .mono { font-family: 'SF Mono','Fira Code',monospace; }
  .setup-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 12px; border-top: 1px solid #F0F0F0; }
  .setup-row .label { font-size: 14px; color: #666; }
  .setup-row .value { font-size: 14px; font-family: 'SF Mono','Fira Code',monospace; font-weight: 600; }
  .tabs { display: flex; border-bottom: 1px solid #E8E8E8; }
  .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: none; color: #999; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: inherit; }
  .tab.active { color: #051024; border-bottom-color: #051024; }
  .tab-content { padding: 20px; }
  .tier-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
  .tier-table th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #E8E8E8; }
  .tier-table th.right, .tier-table td.right { text-align: right; }
  .tier-table td { padding: 10px; border-bottom: 1px solid #F0F0F0; font-family: 'SF Mono','Fira Code',monospace; }
  .tier-table td.label-cell { font-family: inherit; font-weight: 500; color: #555; }
  .tier-table .blank-price { color: #051024; font-weight: 600; }
  .tier-table .addon-price { color: #1a7698; font-weight: 600; }
  .tier-table .total-price { color: #051024; font-weight: 700; font-size: 15px; }
  .tier-table .profit-cell { color: #2E7D32; }
  .breakdown .section-label { font-size: 10px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.5px; margin: 8px 0 4px; }
  .breakdown .line { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .breakdown .line .l { color: #888; }
  .breakdown .line .v { font-family: 'SF Mono','Fira Code',monospace; color: #555; }
  .breakdown .line.blue .l, .breakdown .line.blue .v { color: #1a7698; font-weight: 600; }
  .legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 12px; font-size: 11px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .dot-blank { background: #051024; }
  .legend .dot-addon { background: #1a7698; }
  .config-bar { background: #051024; border-radius: 12px; padding: 16px 20px; margin-top: 12px; color: #fff; }
  .config-bar .config-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .config-bar .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
  .config-bar .config-grid .ck { color: #888; }
  .config-bar .config-grid .cv { text-align: right; font-family: 'SF Mono','Fira Code',monospace; }
  .footer { text-align: center; font-size: 11px; color: #bbb; margin: 20px 0 8px; line-height: 1.5; }

  /* Catalog */
  .catalog-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #1a7698; cursor: pointer; font-weight: 600; padding: 6px 12px; border-radius: 20px; border: 1px solid #cfe9f3; background: #e8f5fa; transition: all .15s; }
  .catalog-toggle:hover { background: #cfe9f3; }
  .catalog-panel { background: #F8F8F5; border: 1px solid #E8E8E8; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .catalog-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #fff; border-radius: 6px; cursor: pointer; border: 1px solid #E8E8E8; font-size: 13px; margin-bottom: 5px; transition: border-color .15s; }
  .catalog-item:hover, .catalog-item.active { border-color: #1a7698; }
  .cat-form { margin-top: 10px; padding: 12px; background: #fff; border-radius: 8px; border: 1px solid #E8E8E8; }
  .cat-form .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cat-form input, .cat-form textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; }
  .cat-form input:focus, .cat-form textarea:focus { border-color: #1a7698; }
  .cat-form .form-actions { display: flex; gap: 6px; }
  .cat-form .save-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #1a7698; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .cat-form .del-btn { padding: 8px 12px; background: #fff; border: 1px solid #fca5a5; border-radius: 6px; color: #dc2626; font-size: 13px; cursor: pointer; font-family: inherit; }
  .cat-form .cancel-btn { padding: 8px 12px; background: #F0F0F0; border: none; border-radius: 6px; color: #666; font-size: 13px; cursor: pointer; font-family: inherit; }
  .add-btn { width: 100%; padding: 8px; background: #fff; border: 1.5px dashed #ddd; border-radius: 6px; color: #999; font-size: 12px; cursor: pointer; font-family: inherit; margin-top: 8px; }

  /* Order builder */
  .order-item { position: relative; background: #F8F8F5; border: 1px solid #E8E8E8; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .combo-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 8px 0 4px; font-size: 13px; }
  .combo-bar select { padding: 7px 10px; border: 1px dashed #9cc9d6; border-radius: 8px; background: #F1F8F9; color: #1a7698; font-family: inherit; font-size: 13px; max-width: 100%; }
  .combo-on { background: #E3F2F6; color: #0f4c63; border-radius: 8px; padding: 6px 10px; }
  .split-toggle { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:#555; cursor:pointer; }
  .vend-tag { display:inline-block; font-size:10px; font-weight:600; color:#6b4e00; background:#FFF4D6; border:1px solid #F5DFA3; border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:1px; }
  .vend-line { display:block; font-size:11px; color:#8a6d1f; margin-top:2px; white-space:pre-wrap; }
  .vend-line .vend-tag { margin-left:0; }
  .int-box { background:#FFFBEF; border:1px dashed #F5DFA3; border-radius:6px; padding:8px 10px 2px; margin:8px 0; }
  .site-box { background:#F1F8F9; border:1px dashed #9cc9d6; border-radius:6px; padding:8px 10px; margin:8px 0; }
  .site-box .int-head { color:#1a7698; }
  .site-box select { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; background:#fff; }
  .site-show { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:#051024; margin-bottom:8px; cursor:pointer; }
  .site-show input { width:auto; }
  .sc-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .sc-row input[type=color] { width:34px; height:30px; padding:2px; flex:0 0 34px; }
  .sc-row input[type=text] { flex:1; min-width:0; }
  .sc-row label { display:flex; align-items:center; gap:4px; font-size:12px; color:#555; white-space:nowrap; cursor:pointer; }
  .sc-row label input { width:auto; }
  .sc-row.off input[type=text] { color:#aaa; text-decoration:line-through; }
  .sc-pics { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .sc-pic { width:34px; height:34px; border:1px solid #ddd; border-radius:6px; background:#fff; padding:0; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:#4b5563; line-height:1.1; }
  .sc-pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .sc-pic.empty { border-style:dashed; background:#fafbfc; }
  .sc-pic:hover { border-color:#1a7698; }
  .sc-pic.busy { opacity:.5; pointer-events:none; }
  .sc-x { border:none; background:none; color:#999; font-size:16px; cursor:pointer; padding:0 4px; }
  .site-tag { display:inline-block; font-size:10px; font-weight:600; color:#1a7698; background:#E3F2F6; border:1px solid #b5dbe6; border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:1px; }
  .int-head { font-size:10px; font-weight:700; color:#8a6d1f; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .oi-supplier { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; color:#888; }
  .oi-supplier input { flex:1; min-width:0; padding:7px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; outline:none; background:#fff; }
  .oi-supplier input:focus { border-color:#1a7698; }
  .oi-suggest { position: absolute; left: 14px; right: 14px; top: 54px; z-index: 6; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); overflow: hidden; max-height: 320px; overflow-y: auto; }
  .oi-suggest button { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 10px 12px; border: none; background: #fff; text-align: left; font-size: 13px; cursor: pointer; font-family: inherit; border-bottom: 1px solid #F0F0F0; }
  .oi-suggest button:last-child { border-bottom: none; }
  .oi-suggest button b { flex: none; min-width: 64px; font-family: 'SF Mono','Fira Code',monospace; color: #051024; }
  .oi-suggest button span { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .oi-suggest button.hl, .oi-suggest button:hover { background: #e8f5fa; }
  .oi-suggest button em { flex:none; font-style:normal; font-size:10px; color:#1a7698; font-weight:600; }
  .oi-suggest button i.sg-r { margin-left:auto; flex:none; display:flex; gap:10px; align-items:baseline; font-style:normal; }
  .oi-suggest button i.sg-r u { text-decoration:none; font-family:'SF Mono','Fira Code',monospace; font-size:12px; font-weight:600; color:#051024; }
  .order-item .oi-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .order-item .oi-code { flex: 0 0 90px; }
  .order-item .oi-code input { width: 100%; padding: 8px; border: 2px solid #1a7698; border-radius: 6px; font-size: 14px; font-weight: 700; text-align: center; outline: none; text-transform: uppercase; font-family: 'SF Mono','Fira Code',monospace; }
  .order-item .oi-qty { flex: 0 0 60px; }
  .order-item .oi-qty input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: center; outline: none; font-family: 'SF Mono','Fira Code',monospace; }
  .order-item .oi-color { flex: 0 0 120px; }
  .order-item .oi-color { display: flex; gap: 4px; align-items: center; }
  .order-item .oi-color select { width: 100%; padding: 8px 6px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; font-family: inherit; }
  .order-item .oi-color select.need { border-color: #f0b4b4; background: #fff7f7; }
  .order-item .oi-color input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; font-family: inherit; }
  .order-item .oi-color input.need { border-color: #f0b4b4; background: #fff7f7; }
  .order-item .oi-top { flex-wrap: wrap; }
  .mk-sides { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 2px; font-size: 12px; color: #666; }
  .mk-sides .sd { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 3px; border: 1px solid #ddd; border-radius: 999px; background: #fff; font-size: 12px; }
  .mk-sides .sd img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: #f4f4f4; }
  .mk-sides button.sd { cursor: pointer; border-style: dashed; color: #1a7698; padding: 4px 10px; font-family: inherit; }
  .mk-colorhead { font-weight: 700; color: #1a7698; }
  .mk-colorhead.need { color: #c0392b; }
  .order-item .oi-info { flex: 1; font-size: 12px; color: #555; min-height: 20px; display: flex; align-items: center; }
  .order-item .oi-info .pname { font-weight: 600; color: #051024; }
  .order-item .oi-info { flex-wrap: wrap; }
  .order-item .oi-info .vend-line { flex-basis: 100%; }
  .order-item .oi-info .notfound { color: #dc2626; }
  .order-item .oi-move { display: flex; align-items: center; gap: 4px; margin: -6px 0 8px; }
  .order-item .oi-move button { border: 1px solid #ddd; background: #fff; border-radius: 4px; font-size: 10px; padding: 2px 6px; cursor: pointer; color: #555; }
  .order-item .oi-move button:disabled { opacity: .35; cursor: default; }
  .order-item .oi-handle { cursor: grab; touch-action: none; user-select: none; font-size: 15px; color: #999; padding: 0 6px 0 0; }
  .order-item.dragging { box-shadow: 0 6px 18px rgba(0,0,0,.15); border-color: #41a9cc; z-index: 2; }
  .order-item .oi-remove { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 0 4px; }
  .order-item .oi-result { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid #E8E8E8; }
  .order-item .oi-result .price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .order-item .oi-result .detail { font-size: 11px; color: #888; font-family: 'SF Mono','Fira Code',monospace; }
  .order-item .oi-result .profit { font-size: 11px; color: #2E7D32; }
  .total-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #E8E8E8; background: #fff; color: #555; margin-right: 8px; }
  .total-pill b { color: #051024; }
  .min-warn { font-size: 11px; color: #dc2626; margin-top: 4px; }

  /* Quote */
  .quote-card { background: #fff; border: 1px solid #E8E8E8; border-radius: 12px; overflow: hidden; margin-top: 12px; }
  .quote-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #E8E8E8; }
  .quote-header span { font-size: 12px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .copy-btn { padding: 6px 14px; background: #1a7698; border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; }
  .copy-btn.copied { background: #16a34a; }
  .quote-header { flex-wrap:wrap; gap:8px; }
  .qmode { display:flex; background:#F0F0F0; border-radius:8px; padding:3px; gap:2px; }
  .qmode button { border:none; background:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; color:#666; cursor:pointer; font-family:inherit; }
  .qmode button.active { background:#051024; color:#fff; }
  .qmode-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; font-size:12px; color:#888; border-bottom:1px solid #E8E8E8; }
  .qmode-bar label { display:flex; align-items:center; gap:6px; color:#555; cursor:pointer; font-weight:600; }
  .qblock + .qblock { border-top:6px solid #f0f0f0; }
  .qblock-head { display:flex; justify-content:space-between; align-items:center; padding:10px 16px 0; font-size:12px; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:.5px; }
  .quote-text { padding: 14px 16px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #333; }

  /* Mockup */
  .mk-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .mk-fields { display:flex; gap:12px; margin-bottom:12px; }
  .mk-fields .field input { text-align:left; }
  .mk-sub { display:block; font-size:12px; color:#888; margin-bottom:6px; }
  .mk-stage { position:relative; margin-top:12px; border-radius:10px; overflow:hidden; background:#F0F0EB; border:1px solid #E8E8E8; }
  .mk-stage canvas { display:block; width:100%; height:auto; touch-action:none; cursor:move; }
  .mk-drop { padding:28px 18px; text-align:center; font-size:13px; color:#666; line-height:1.55; border:1.5px dashed #cfcfc8; border-radius:10px; background:#FAFAF7; cursor:pointer; outline:none; }
  .mk-drop:focus, .mk-drop.target { border-color:#1a7698; background:#e8f5fa; }
  .mk-drop b { color:#051024; }
  .mk-style { border:1px solid #E8E8E8; border-radius:10px; padding:12px; margin-top:12px; background:#FAFAF7; }
  .mk-style-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; margin-bottom:8px; }
  .mk-style-head span { color:#888; }
  .mk-style .field input { text-align:left; background:#fff; }
  .mk-views { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:10px; }
  .mk-view { min-width:0; outline:none; }
  .mk-view.editing .mk-thumb { outline:2px solid #1a7698; outline-offset:2px; }
  .mk-thumb { display:block; width:100%; height:auto; border-radius:8px; background:#F0F0EB; cursor:pointer; }
  .mk-view-tools { margin-top:2px; }
  .mk-view-tools .mk-link:disabled { color:#999; cursor:default; }
  .mk-view-cap { display:flex; justify-content:space-between; font-size:11px; color:#888; margin-top:4px; gap:6px; }
  .mk-slot { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; min-height:150px; padding:12px; border:1.5px dashed #cfcfc8; border-radius:8px; background:#fff; font-size:12px; font-weight:600; color:#555; }
  .mk-slot span { font-weight:400; color:#999; font-size:11px; }
  .mk-slot-up { cursor:pointer; outline:none; }
  .mk-slot-up:focus { border-color:#1a7698; background:#e8f5fa; }
  .mk-slot .mk-upbtn { margin-bottom:4px; color:#fff; font-size:12px; font-weight:600; }
  .mk-final { margin-top:14px; padding:12px; border:1.5px solid #051024; border-radius:10px; }
  .mk-final-title { font-size:13px; font-weight:700; color:#051024; }
  .mk-final-sub { font-size:12px; color:#888; margin-top:2px; }
  .mk-all { width:100%; margin-top:12px; padding:12px 0; border-radius:8px; border:1.5px solid #051024; background:#fff; color:#051024; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .mk-editor { margin-top:14px; padding:12px; border:1px solid #1a7698; border-radius:10px; }
  .mk-logo-empty { width:48px; height:48px; border-radius:6px; background:#F0F0EB; display:flex; align-items:center; justify-content:center; font-size:10px; color:#999; flex:none; }
  .mk-inline { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; color:#555; cursor:pointer; }
  .mk-sub { margin-top:4px; }
  .mk-upbtn { display:inline-block; margin-bottom:10px; padding:10px 18px; border-radius:8px; background:#051024; color:#fff; font-weight:600; font-size:13px; }
  .mk-drop .tip { display:block; margin-top:8px; font-size:11px; color:#999; }
  .mk-status { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:#888; margin-top:10px; flex-wrap:wrap; }
  .mk-link { color:#1a7698; cursor:pointer; font-weight:600; background:none; border:none; font-size:12px; font-family:inherit; padding:0; }
  .mk-logo { display:flex; align-items:center; gap:12px; margin-top:12px; padding:10px; border:1px solid #E8E8E8; border-radius:10px; background:#FAFAF7; outline:none; }

    if (!sb) { bar.className = "warn"; bar.innerHTML = '<img class="tc-logo" src="https://cdn.shopify.com/s/files/1/0730/9158/0092/files/logo-png.png?v=1773444846" alt="TBDezign"><span class="tc-dot"></span><span class="tc-msg">Sem conexão com o banco (verifique a internet e recarregue). Usando a cópia salva neste navegador; produtos não podem ser editados.</span>'; return; }
    if (!user) {
      bar.className = "warn";
      bar.innerHTML = '<img class="tc-logo" src="https://cdn.shopify.com/s/files/1/0730/9158/0092/files/logo-png.png?v=1773444846" alt="TBDezign"><span class="tc-dot"></span><span class="tc-msg">' + (lastErr ? esc(lastErr) : "Entre para carregar e salvar os produtos.") + '</span>'
        + '<form id="tcForm"><input id="tcEmail" type="email" autocomplete="username" placeholder="Email" value="info@tbdezign.com"><input id="tcPass" type="password" autocomplete="current-password" placeholder="Senha"><button type="submit">Entrar</button></form>';
      document.getElementById("tcForm").onsubmit = async e => {
        e.preventDefault(); lastErr = "";
        const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Entrando…";
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("tcEmail").value.trim(), password: document.getElementById("tcPass").value });
        if (error) { lastErr = /invalid/i.test(error.message) ? "Email ou senha incorretos." : "Não foi possível entrar: " + error.message; render(); }
      };
      return;
    }
    bar.className = lastErr ? "warn" : "ok";
    const status = lastErr ? esc(lastErr) : pending ? "Salvando…" : lastSync ? "Sincronizado " + time(lastSync) : "Carregando produtos…";
    bar.innerHTML = '<img class="tc-logo" src="https://cdn.shopify.com/s/files/1/0730/9158/0092/files/logo-png.png?v=1773444846" alt="TBDezign"><span class="tc-dot"></span><span class="tc-msg">' + esc(user.email) + ' · ' + status + '</span><button class="tc-ghost" id="tcReload">Atualizar</button><button class="tc-ghost" id="tcOut">Sair</button>';
    document.getElementById("tcOut").onclick = async () => { await sb.auth.signOut(); };
    document.getElementById("tcReload").onclick = () => scheduleLoad();
  }

  let loadTimer = null;
  function scheduleLoad() { clearTimeout(loadTimer); loadTimer = setTimeout(load, 0); }
  async function load() {
    if (!sb || !user) return;
    lastErr = ""; render();
    for (const h of handlers) {
      try { await h(); } catch (e) { lastErr = "Erro ao carregar produtos: " + (e.message || e); }
    }
    if (!lastErr) lastSync = new Date();
    render();
  }

  // Run a write; shows status and errors in the bar. Returns true on success.
  async function write(fn) {
    if (!sb || !user) { lastErr = "Entre (login) para salvar produtos."; render(); if (Date.now() - lastAlert > 5000) { lastAlert = Date.now(); alert("Você precisa entrar (login) no topo da página para salvar produtos."); } return false; }
    pending++; render();
    try {
      const res = await fn(sb);
      if (res && res.error) throw res.error;
      lastSync = new Date(); lastErr = ""; return true;
    } catch (e) {
      lastErr = "Não salvou: " + (e.message || e) + ". Verifique a internet e tente de novo."; return false;
    } finally { pending--; render(); }
  }

  if (sb) {
    sb.auth.onAuthStateChange((event, session) => {
      const was = user && user.email;
      user = session ? session.user : null;
      render();
      if (user && was !== user.email) scheduleLoad();
    });
  }
  render();

  // Reload when coming back to the tab after a while (picks up changes made on another device)
  let lastFocus = Date.now();
  window.addEventListener("focus", () => { if (Date.now() - lastFocus > 60000) scheduleLoad(); lastFocus = Date.now(); });
  window.addEventListener("blur", () => { lastFocus = Date.now(); });

  return {
    get sb() { return sb; },
    get user() { return user; },
    get loggedIn() { return !!(sb && user); },
    onLoad(fn) { handlers.push(fn); if (sb && user) scheduleLoad(); },
    write, load,
  };
})();

function oiDragStart(e) {
  e.preventDefault();
  const item = e.target.closest(".order-item"), list = q("orderItems");

    const items = [...list.querySelectorAll(":scope > .order-item")];
    for (const other of items) {
      if (other === item) continue;
      const r = other.getBoundingClientRect(), mid = r.top + r.height / 2, before = items.indexOf(other) < items.indexOf(item);
      if (before && ev.clientY < mid) { list.insertBefore(item, other); break; }
      if (!before && ev.clientY > mid) { list.insertBefore(item, other.nextSibling); break; }
    }

    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end); window.removeEventListener("pointercancel", end);
    item.classList.remove("dragging");
    const ids = [...list.querySelectorAll(":scope > .order-item")].map(x => x.dataset.id);

function compose(ctx, W, H, img, logo, box, shade, outline, emb) {

    const t = document.createElement("canvas"); t.width = tw; t.height = th;

}

// Embroidery look: satin thread ridges, raised edges (light top-left, shade bottom-right) and a soft shadow on the fabric.
function embroider(L, G, tw, th, lw, shade, mean) {
  const A = new Float32Array(tw * th);
  for (let i = 0; i < A.length; i++) A[i] = L[i*4+3] / 255;
  const a = (x, y) => (x < 0 || y < 0 || x >= tw || y >= th) ? 0 : A[y*tw + x];
  const period = Math.max(2.6, lw / 110);            // thread spacing
  const r = Math.max(1, Math.round(period * 0.8));    // bevel width
  const d = Math.max(1, Math.round(lw * 0.006));      // shadow offset
  // Soft shadow under the stitches.
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
    const sh = (a(x-d, y-d) + a(x-d-1, y-d) + a(x-d, y-d-1)) / 3;
    if (sh <= 0) continue;
    const k = 1 - 0.32 * sh * (1 - a(x, y)), i = (y*tw + x) * 4;
    G[i] *= k; G[i+1] *= k; G[i+2] *= k;
  }
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
    const al = A[y*tw + x]; if (al <= 0) continue;
    const i = (y*tw + x) * 4;
    // Each color area gets its own stitch direction, like separate thread fills.
    const ck = ((L[i] >> 6) * 7 + (L[i+1] >> 6) * 3 + (L[i+2] >> 6)) & 1;
    const u = (x + (ck ? -y : y)) / period;
    const ridge = Math.pow(0.5 + 0.5 * Math.cos(2 * Math.PI * u), 0.8);
    const noise = ((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1) * 0.06;
    const thread = 0.74 + 0.36 * ridge + noise;
    const edge = a(x - r, y - r) - a(x + r, y + r);                   // + on lower-right edges, − on upper-left
    // Thread gap where two colors meet.
    const j = (Math.min(th - 1, y + 1) * tw + Math.min(tw - 1, x + 1)) * 4;
    const cdiff = (Math.abs(L[i] - L[j]) + Math.abs(L[i+1] - L[j+1]) + Math.abs(L[i+2] - L[j+2])) / 765;
    const bevel = (1 - 0.42 * edge) * (1 - 0.45 * Math.min(1, cdiff * 2.5));
    const lum = .299*G[i] + .587*G[i+1] + .114*G[i+2];
    let s = (lum + 20) / mean; s = s < .6 ? .6 : s > 1.25 ? 1.25 : s;
    const f = thread * bevel * (1 + shade * 0.5 * (s - 1));
    for (let c = 0; c < 3; c++) { let v = L[i+c] * f + (ridge > 0.85 ? 10 : 0); v = v > 255 ? 255 : v < 0 ? 0 : v; G[i+c] = v * al + G[i+c] * (1 - al); }
  }
}
