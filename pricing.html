<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TBDezign Pricing Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    max-width: 720px; margin: 0 auto; padding: 24px 16px;
    color: #051024; line-height: 1.5; background: #fff;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; }
  .subtitle { font-size: 13px; color: #777; }
  .top-tools { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .link-btn {
    font-size: 12px; color: #999; background: none; border: none;
    cursor: pointer; text-decoration: underline; font-family: inherit;
  }

  /* Product card */
  .quote { background: #fafafa; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .q-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; flex-wrap: wrap; }
  .quote:not(.collapsed) .q-head { margin-bottom: 12px; }
  .q-left { display: flex; align-items: flex-start; gap: 8px; min-width: 0; flex: 1; }
  .chev { font-size: 12px; color: #999; transition: transform .15s; margin-top: 3px; flex-shrink: 0; }
  .quote:not(.collapsed) .chev { transform: rotate(90deg); }
  .q-meta { min-width: 0; }
  .q-num { font-size: 12px; font-weight: 700; color: #051024; text-transform: uppercase; letter-spacing: 0.5px; }
  .q-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-sum { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote:not(.collapsed) .q-title, .quote:not(.collapsed) .q-sum { display: none; }
  .quote.collapsed { padding: 12px 16px; margin-bottom: 8px; }
  .quote.collapsed .q-body { display: none; }
  .quote.collapsed:hover { background: #f3f3f3; }
  .q-actions { display: flex; gap: 6px; align-items: center; }
  .q-actions button {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px;
    border: 1px solid #ddd; background: #fff; cursor: pointer; font-family: inherit; color: #555;
  }
  .q-actions button:hover { border-color: #999; }
  .q-actions .danger:hover { border-color: #ef4444; color: #ef4444; }
  .q-actions .primary { background: #051024; color: #fff; border-color: #051024; }
  .q-actions .primary:hover { background: #13294a; border-color: #13294a; }
  .q-actions .x-btn { border: none; background: none; padding: 0 4px; font-size: 20px; }
  .in-cat { font-size: 11px; font-weight: 600; color: #051024; background: #ddeff6; padding: 2px 8px; border-radius: 10px; margin-left: 8px; text-transform: none; letter-spacing: 0; }

  .section-title {
    font-size: 11px; font-weight: 700; color: #051024; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 16px 0 8px; padding-top: 14px; border-top: 1px solid #eee;
  }
  .section-hint { font-size: 12px; color: #999; margin: -4px 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .cat-row { margin: 0 0 10px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
  .field { min-width: 0; }
  .field label {
    font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase;
    letter-spacing: 0.5px; display: block; margin-bottom: 4px;
  }
  .input-wrap { position: relative; }
  .input-wrap .dollar {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: #999; font-size: 14px; font-weight: 600; pointer-events: none;
  }
  input[type="number"], input[type="text"], select {
    width: 100%; padding: 9px 11px; font-size: 14px; border: 2px solid #e0e0e0;
    border-radius: 7px; outline: none; font-weight: 500; font-family: inherit; background: #fff; color: #051024;
  }
  .input-wrap input { padding-left: 25px; font-weight: 600; }
  .dashed input { border-style: dashed; border-color: #ddd; background: transparent; font-weight: 400; }
  input:focus, select:focus { border-color: #999 !important; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  .suffix-hint { font-size: 11px; color: #aaa; margin-top: 3px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .custom-row, .note-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .custom-row input:first-child { flex: 0 0 38%; }
  .x-btn {
    background: none; border: none; cursor: pointer; color: #bbb;
    font-size: 20px; line-height: 1; padding: 0 4px; font-family: inherit;
  }
  .x-btn:hover { color: #ef4444; }
  .q-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .text-btn {
    font-size: 13px; font-weight: 600; color: #051024; background: none;
    border: none; cursor: pointer; font-family: inherit; padding: 0;
  }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .check input { width: 16px; height: 16px; accent-color: #051024; }
  .check.small { font-size: 12px; font-weight: 500; color: #777; }
  .note-row.internal input[type="text"] { background: #fff8e6; border-color: #f3e2b3; }

  /* Price lines */
  .line { background: #fff; border: 1px solid #eee; border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; }
  .line-top { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .line-top input { border-width: 1px; font-size: 13px; }
  .line-row { display: grid; grid-template-columns: 0.8fr 1fr 1fr 1fr; gap: 8px; }
  .line-result {
    display: none; margin-top: 8px; background: #051024;
    border-radius: 7px; padding: 8px 12px; font-size: 12px; color: #999;
    align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .line-result.show { display: flex; }
  .lr-price { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .lr-margin { font-size: 15px; font-weight: 800; }
  .override-tag { font-size: 11px; color: #f59e0b; font-weight: 600; }
  .margin-green { color: #4ade80; }
  .margin-yellow { color: #f59e0b; }
  .margin-red { color: #ef4444; }
  .add-line {
    width: 100%; padding: 9px; font-size: 13px; font-weight: 600;
    background: transparent; color: #051024; border: 1.5px dashed #a9d3e3;
    border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  .add-line:hover { background: #eaf5f9; }

  /* Price options (variants) */
  .opt { background: #fff; border: 1px solid #eee; border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; }
  .opt-top { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .opt-top input { font-weight: 700; border-width: 1px; }
  .opt-table-wrap { overflow-x: auto; margin-bottom: 6px; }
  .opt-table { border-collapse: collapse; width: 100%; min-width: 100%; }
  .opt-table th {
    font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.4px;
    text-align: left; padding: 0 4px 4px; white-space: nowrap;
  }
  .opt-table td { padding: 3px 4px; vertical-align: top; }
  .opt-table td:first-child { min-width: 150px; }
  .opt-table td.cell { min-width: 92px; }
  .opt-table input { font-size: 13px; padding: 6px 8px; border-width: 1px; }
  .opt-table .input-wrap input { padding-left: 20px; }
  .opt-table .input-wrap .dollar { left: 8px; font-size: 12px; }
  .opt-table .input-wrap + .input-wrap { margin-top: 3px; }
  .opt-table td.def { font-size: 12px; color: #aaa; padding-top: 10px; white-space: nowrap; }
  .opt-legend { font-size: 11px; color: #aaa; margin-bottom: 4px; }
  .mode-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; font-size: 13px; font-weight: 600; }
  .mode-row select { width: auto; flex: 1; font-size: 13px; padding: 7px 10px; border-width: 1px; }
  .matrix { overflow-x: auto; }
  .matrix table { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; border-radius: 8px; }
  .matrix th, .matrix td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; text-align: left; white-space: nowrap; }
  .matrix th { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; }
  .matrix td b { font-weight: 700; }
  .matrix td small { font-size: 11px; font-weight: 700; margin-left: 4px; }
  .matrix .m-green { color: #051024; } .matrix .m-yellow { color: #b45309; } .matrix .m-red { color: #dc2626; }

  /* Output */
  .output { margin-top: 14px; background: #fff; border: 2px solid #051024; border-radius: 10px; overflow: hidden; }
  .out-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #051024; color: #fff;
  }
  .out-head span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .out-head div { display: flex; gap: 6px; }
  .out-head button {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 5px; border: none;
    cursor: pointer; font-family: inherit; background: #fff; color: #051024;
  }
  .out-head button.ghost { background: transparent; color: #bbb; border: 1px solid #555; }
  .out-text { padding: 12px 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; color: #333; }
  .out-text.empty { color: #aaa; font-style: italic; }

  .add-btn {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
    background: #fff; color: #051024; border: 2px dashed #051024;
    border-radius: 8px; cursor: pointer; margin-bottom: 12px; font-family: inherit;
  }
  .add-btn:hover { background: #eaf5f9; }
  .copy-all {
    width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
    background: #051024; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; margin-bottom: 24px; font-family: inherit; display: none;
  }
  .copy-all.show { display: block; }
  .copy-all:hover { background: #13294a; }

  /* Catalog */
  .catalog { background: #f5f5f0; border-radius: 12px; padding: 16px 18px; margin-bottom: 24px; }
  .cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .cat-head h3 { font-size: 14px; font-weight: 700; }
  .cat-tools { display: flex; gap: 10px; }
  .cat-search { margin-bottom: 10px; border-width: 1px !important; }
  #catList { max-height: 70vh; overflow-y: auto; }
  .cat-group { margin-bottom: 6px; }
  .cat-group > summary {
    cursor: pointer; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 8px;
    background: #ebebe4; list-style: none; display: flex; justify-content: space-between;
  }
  .cat-group > summary::-webkit-details-marker { display: none; }
  .cat-group > summary::before { content: '▶'; font-size: 10px; color: #999; margin-right: 8px; transition: transform .15s; display: inline-block; }
  .cat-group[open] > summary::before { transform: rotate(90deg); }
  .cat-group > summary .sum-l { flex: 1; }
  .cat-group > summary .count { color: #999; font-weight: 500; }
  .cat-group-body { padding: 6px 0 2px 12px; }
  .cat-subhead { font-size: 11px; font-weight: 700; color: #051024; text-transform: uppercase; letter-spacing: 0.4px; margin: 8px 0 4px; }
  .cat-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: #fff; border-radius: 8px; padding: 9px 12px; margin-bottom: 5px;
  }
  .cat-info { min-width: 0; }
  .cat-title { font-weight: 700; font-size: 13px; }
  .cat-sub { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .cat-add {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: none;
    background: #051024; color: #fff; cursor: pointer; font-family: inherit;
  }
  .cat-empty { font-size: 13px; color: #999; }
  .cat-card { background: #fff; border-radius: 8px; margin-bottom: 5px; }
  .cat-card .cat-item { margin-bottom: 0; }
  .cat-info { cursor: pointer; flex: 1; display: flex; gap: 8px; align-items: flex-start; }
  .cat-chev { font-size: 10px; color: #aaa; margin-top: 4px; transition: transform .15s; flex-shrink: 0; }
  .cat-card.open .cat-chev { transform: rotate(90deg); }
  .cat-info:hover .cat-title { color: #051024; }
  .cat-detail { display: none; padding: 0 12px 12px; border-top: 1px solid #f0f0f0; }
  .cat-card.open .cat-detail { display: block; }
  .cd-label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.4px; margin: 12px 0 6px; }
  .cd-text { font-size: 13px; white-space: pre-wrap; word-break: break-word; color: #333; background: #fafafa; border-radius: 7px; padding: 10px 12px; }
  .cd-table { overflow-x: auto; }
  .cd-table table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .cd-table th, .cd-table td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; text-align: left; white-space: nowrap; }
  .cd-table th { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; }
  .cd-table small { font-size: 11px; font-weight: 700; margin-left: 4px; }
  .cd-table .m-green { color: #051024; } .cd-table .m-yellow { color: #b45309; } .cd-table .m-red { color: #dc2626; }
  .cd-internal { font-size: 13px; background: #fff8e6; border-radius: 7px; padding: 8px 12px; }
  .cd-actions { display: flex; gap: 6px; margin-top: 12px; }
  .cd-actions button {
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #ddd; background: #fff; cursor: pointer; font-family: inherit; color: #555;
  }
  .cd-actions button.primary { background: #051024; color: #fff; border-color: #051024; }

  .formula { background: #f5f5f0; border-radius: 10px; padding: 16px 18px; margin-bottom: 24px; font-size: 13px; color: #555; }
  .formula-title { font-weight: 700; color: #051024; margin-bottom: 8px; }
  .formula-row { margin-bottom: 4px; }

  /* Log */
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .log-header h3 { font-size: 14px; font-weight: 700; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; background: #fafafa; border-radius: 8px; font-size: 13px; margin-bottom: 6px;
  }
  .log-item .note { color: #051024; margin-left: 8px; }
  .log-item .log-price { font-weight: 700; font-size: 15px; }
  .log-item .log-margin { margin-left: 8px; font-size: 12px; font-weight: 600; }
  .log-section { display: none; }
  .log-section.show { display: block; }

  /* Mockups */
  .mock-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .mock-grid:empty { display: none; }
  .mock { width: 130px; background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
  .mock .thumb { height: 100px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; cursor: zoom-in; }
  .mock .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .mock .file-tag { font-size: 12px; font-weight: 700; color: #999; }
  .mock .mname { font-size: 11px; color: #777; padding: 4px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mock .mbtns { display: flex; border-top: 1px solid #f0f0f0; }
  .mock .mbtns button {
    flex: 1; font-size: 11px; font-weight: 600; padding: 5px 0; border: none; background: none;
    cursor: pointer; font-family: inherit; color: #051024;
  }
  .mock .mbtns button + button { border-left: 1px solid #f0f0f0; }
  .mock .mbtns button[data-mock="del"] { color: #bbb; flex: 0 0 28px; }
  .mock .mbtns button[data-mock="del"]:hover { color: #ef4444; }
  .drop {
    display: block; border: 1.5px dashed #a9d3e3; border-radius: 8px; padding: 10px; text-align: center;
    font-size: 13px; font-weight: 600; color: #051024; cursor: pointer;
  }
  .drop span { font-weight: 400; color: #999; font-size: 12px; }
  .drop.over, .drop:hover { background: #eaf5f9; }
  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 50;
    align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }

  @media (max-width: 520px) {
    .grid2 { grid-template-columns: 1fr; }
    .line-row { grid-template-columns: 1fr 1fr; }
  }
  .vend-tag { display:inline-block; font-size:10px; font-weight:600; color:#6b4e00; background:#FFF4D6; border:1px solid #F5DFA3; border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:2px; }
  .int-box { background:#FFFBEF; border:1px dashed #F5DFA3; border-radius:8px; padding:10px 12px 2px; margin:14px 0 4px; }
  .int-head { font-size:10px; font-weight:700; color:#8a6d1f; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .int-box textarea { width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1px solid #ddd; border-radius:6px; resize:vertical; box-sizing:border-box; }

  /* ── TBDezign brand ── */
  body { font-family: Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  h1 { font-family: Montserrat, Poppins, sans-serif; font-weight: 700; color: #051024; letter-spacing: -0.2px; }
  button, input, select, textarea { font-family: inherit; }
  .q-num, .section-title { font-family: Montserrat, Poppins, sans-serif; }

  /* iPhone zooms in when a field's text is under 16px: keep fields at 16px on phones/tablets */
  @media (max-width: 1024px), (pointer: coarse) { input, select, textarea { font-size: 16px !important; } }
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>Pricing Calculator</h1>
    <p class="subtitle">Specs + vendor cost → WhatsApp-ready quote</p>
  </div>
  <div class="top-tools">
    <button class="link-btn" onclick="collapseAll()">Collapse all</button>
    <button class="link-btn" onclick="resetAll()">Start new quote</button>
  </div>
</div>

<datalist id="dl-cats"></datalist>
<div id="quotes"></div>

<button class="add-btn" onclick="addQuote()">+ Add another product</button>
<button class="copy-all" id="copyAll" onclick="copyText(allText(), this)">Copy all products</button>

<div class="catalog">
  <div class="cat-head">
    <h3>Catalog <span id="catCount" style="color:#999;font-weight:500"></span></h3>
    <div class="cat-tools">
      <button class="link-btn" onclick="exportCatalog()">Export backup</button>
      <button class="link-btn" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importCatalog(this)">
    </div>
  </div>
  <input type="text" class="cat-search" id="catSearch" placeholder="Search catalog…" oninput="renderCatalog()">
  <div id="catList"></div>
</div>

<div class="formula">
  <div class="formula-title">Formula reference</div>
  <div class="formula-row">Base: (vendor + shipping) ÷ 0.53 → rounded up to .99</div>
  <div class="formula-row">Add-on: extra vendor cost ÷ 0.53 → rounded up to the whole dollar</div>
  <div class="formula-row" style="color:#2D5E4A; font-weight:600;">Guaranteed margin: 47%+</div>
</div>

<div class="log-section" id="logSection">
  <div class="log-header">
    <h3>Saved calculations</h3>
    <button class="link-btn" onclick="clearLog()">Clear all</button>
  </div>
  <div id="logList"></div>
</div>

<!-- ═══ TBDezign Cloud (Supabase): login + shared product database ═══ -->
<style>
  #tbdCloud { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; margin: -24px -16px 16px; background: #051024; color: #fff; font: 13px Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, #91bc4d, #41a9cc, #b5b5f7) 1; }
  #tbdCloud .tc-logo { height: 12px; width: auto; filter: brightness(0) invert(1); margin-right: 6px; flex: none; }
  #tbdCloud .tc-msg { color: #b9c7d6 !important; }
  #tbdCloud button { background: #fff; color: #051024; }
  #tbdCloud button.tc-ghost { color: #b9c7d6; border-color: #2a3b55; }
  #tbdCloud input { background: #0d1f3c; border-color: #2a3b55; }
  #tbdCloud .tc-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; }
  #tbdCloud.ok .tc-dot { background: #4ade80; }
  #tbdCloud.warn .tc-dot { background: #fbbf24; }
  #tbdCloud .tc-msg { flex: 1; min-width: 160px; color: #ddd; }

<script>
const DRAFT_KEY = 'tbdezign-quote-draft';
const LOG_KEY = 'tbdezign-pricing-log';
const CATALOG_KEY = 'tbdezign-catalog';
const CATS_KEY = 'tbdezign-categories';
const SUFFIX = ' dias úteis após aprovação da arte';

// Main categories from the website menu (more can be typed in anytime)
const SEED_CATS = {
  'Digital Cards': [], 'Business Cards': ['Premium Business Cards'], 'Print Materials': [],
  'Signs & Banners': [], 'Flags': [], 'Event & Display': [], 'Workwear & Apparel': [],
  'Design Services': [], 'Templates': []
};

// Spec fields: [key, label in form, placeholder, label in WhatsApp text]
const SPECS = [
  ['qtyNote', 'Qty (spec line, optional)', 'e.g. 100, 250 ou 500 un', 'Quantidade'],
  ['size', 'Size', '3.5" x 2"', 'Tamanho'],
  ['stock', 'Stock', '16pt (19pt final com laminação...)', 'Material'],
  ['printing', 'Printing', 'Frente e verso', 'Impressão'],
  ['finish', 'Finish', 'Suede + Spot UV em relevo', 'Acabamento'],
  ['lamination', 'Lamination', 'Velvet / Gloss / Matte', 'Laminação'],
];
const OUT_ORDER = ['stock', 'size', 'printing', 'finish', 'lamination', 'qtyNote'];

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const newLine = (group = '') => ({ id: uid(), group, qty: '', vc: '', sh: '', ov: '' });
const newChoice = () => ({ id: uid(), name: '', add: {} });
const newOption = () => ({ id: uid(), name: '', choices: [newChoice(), newChoice()] });
const newQuote = () => ({
  cat: '', sub: '', title: '', qtyNote: '', size: '', stock: '', printing: '', finish: '', lamination: '',
  vendor: '', memo: '', turnaround: '', freeShip: true, showUnit: false, unitName: '', perUnit: '', pieceName: '', images: [], custom: [], notes: [], options: [], optMode: 'combos',
  lines: [newLine()], collapsed: false
});
// Fill in anything missing from older saved data
function normalize(q) {
  q = Object.assign(newQuote(), q);
  q.lines = (q.lines || []).map(l => Object.assign(newLine(), l, { id: l.id || uid() }));
  if (!q.lines.length) q.lines = [newLine()];
  q.custom = q.custom || []; q.notes = q.notes || []; q.options = q.options || []; q.images = q.images || [];
  return q;
}
const load = (k, fb) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch (e) { return fb; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

let quotes = load(DRAFT_KEY, null);
// Open products stay until you remove them, for up to 30 days after the last change.
const DRAFT_T_KEY = DRAFT_KEY + '-t', DRAFT_DAYS = 30;
if ((load(DRAFT_T_KEY, Date.now())) < Date.now() - DRAFT_DAYS * 86400000) quotes = null;
quotes = Array.isArray(quotes) && quotes.length ? quotes.map(normalize) : [newQuote()];
let logItems = load(LOG_KEY, []);
if (!Array.isArray(logItems)) logItems = [];
let catalog = load(CATALOG_KEY, []);
if (!Array.isArray(catalog)) catalog = [];
let categories = load(CATS_KEY, {});
if (!categories || typeof categories !== 'object' || Array.isArray(categories)) categories = {};
categories = Object.assign({}, SEED_CATS, categories);
catalog.forEach(c => addCategory(c.data.cat, c.data.sub, true));

const wrap = document.getElementById('quotes');
const openGroups = new Set();

/* ---------- Categories ---------- */
function findKey(obj, name) {
  const n = name.trim().toLowerCase();
  return Object.keys(obj).find(k => k.toLowerCase() === n);
}
function addCategory(cat, sub, silent) {
  cat = (cat || '').trim(); sub = (sub || '').trim();
  if (!cat) return { cat: '', sub };
  const key = findKey(categories, cat) || cat;
  categories[key] = categories[key] || [];
  let subKey = sub;
  if (sub) {
    subKey = categories[key].find(s => s.toLowerCase() === sub.toLowerCase()) || sub;
    if (!categories[key].includes(subKey)) categories[key].push(subKey);
  }
  if (!silent) store(CATS_KEY, categories);
  return { cat: key, sub: subKey };
}

/* ---------- Pricing ---------- */
function calcLine(l) {
  const vc = parseFloat(l.vc) || 0, sh = parseFloat(l.sh) || 0, ov = parseFloat(l.ov);
  if (vc <= 0) return null;
  const base = (vc + sh) / 0.53;
  let auto = Math.ceil(base) - 0.01;
  if (auto < base) auto += 1;
  const hasOv = ov > 0;
  const price = hasOv ? ov : auto;
  return { vc, sh, auto, price, hasOv, profit: price - vc - sh, margin: (price - vc - sh) / price * 100 };
}
function addon(choice, lineId) {
  const cell = (choice.add || {})[lineId] || {};
  const v = parseFloat(cell.v) || 0, o = parseFloat(cell.o);
  const auto = v > 0 ? Math.ceil(v / 0.53) : 0;
  return { v, auto, r: o > 0 ? o : auto, ov: o > 0 };
}
const isPriced = o => o.choices.slice(1).some(c => Object.keys(c.add || {}).some(k => addon(c, k).r > 0));
const namedChoices = o => o.choices.filter((c, i) => c.name.trim() || i === 0);
function pricedOptions(q) { return q.options.filter(o => o.name.trim() && isPriced(o)); }
function infoOptions(q) { return q.options.filter(o => o.name.trim() && !isPriced(o) && o.choices.some(c => c.name.trim())); }
function combos(opts) {
  return opts.reduce((acc, o) => acc.flatMap(a => namedChoices(o).map(c => a.concat([c]))), [[]]);
}
function comboPrice(l, combo) {
  const b = calcLine(l);
  if (!b) return null;
  let price = b.price, cost = b.vc + b.sh;
  combo.forEach(c => { const a = addon(c, l.id); price += a.r; cost += a.v; });
  return { price, cost, margin: (price - cost) / price * 100 };
}
const marginClass = m => m >= 40 ? 'margin-green' : m >= 30 ? 'margin-yellow' : 'margin-red';
const money = n => '$' + n.toFixed(2);
const moneyAdd = n => '+$' + (n % 1 ? n.toFixed(2) : n.toFixed(0));
// Price per unit, e.g. $0.38 — 3 decimals when under 10 cents
const qtyNum = l => parseFloat(String(l.qty).replace(/[^\d.]/g, ''));
const perUnit = q => (q && parseFloat(q.perUnit)) || 0;
const unitName = q => ((q && q.unitName) || '').trim() || 'un';
const pieceName = q => ((q && q.pieceName) || '').trim() || 'item';
const plural = w => /s$/i.test(w) ? w : w + 's';
// Price per unit (or per piece when a unit holds several, e.g. labels per sheet)
// → "$0.38/etiqueta". 3 decimals when under 10 cents.
function unitPrice(l, price, q) {
  const n = qtyNum(l);
  if (!(n > 0)) return '';
  const per = perUnit(q);
  const u = price / (per > 0 ? n * per : n);
  return '$' + u.toFixed(u < 0.1 ? 3 : 2) + '/' + (per > 0 ? pieceName(q) : unitName(q));
}
// "50 un", or "50 folhas (250 etiquetas)" when pieces per unit is set
function qtyLabel(l, q) {
  const raw = String(l.qty).trim();
  if (!raw) return '';
  const per = perUnit(q), n = qtyNum(l);
  let txt = raw + ' ' + unitName(q);
  if (per > 0 && n > 0) txt += ' (' + Math.round(n * per) + ' ' + plural(pieceName(q)) + ')';
  return txt;
}
function lineLabel(l, i) {
  const q = qtyLabel(l);
  return [l.group.trim(), q].filter(Boolean).join(' · ') || 'Line ' + (i + 1);
}

/* ---------- WhatsApp text ---------- */
function groupedLines(q) {
  const groups = [], map = {};
  q.lines.forEach(l => {
    if (!calcLine(l)) return;
    const g = l.group.trim();
    if (!(g in map)) { map[g] = []; groups.push(g); }
    map[g].push(l);
  });
  return groups.map(g => ({ g, lines: map[g] }));
}
function quoteText(q) {
  const L = [];
  const block = (header, rows) => {
    if (!rows.length) return;
    if (L.length) L.push('');
    if (header) L.push('_' + header + '_');
    L.push(...rows);
  };
  if (q.title.trim()) L.push('_' + q.title.trim() + '_');
  OUT_ORDER.forEach(k => {
    const spec = SPECS.find(s => s[0] === k);
    if ((q[k] || '').trim()) L.push(spec[3] + ': ' + q[k].trim());
  });
  q.custom.forEach(c => {
    const v = c.value.trim(), lb = c.label.trim();
    if (v) L.push(lb ? lb + ': ' + v : v);
  });
  infoOptions(q).forEach(o => {
    L.push(o.name.trim() + ': ' + o.choices.map(c => c.name.trim()).filter(Boolean).join(' / '));
  });

  const groups = groupedLines(q);
  const priced = pricedOptions(q);
  const row = (l, price) => (qtyLabel(l, q) ? qtyLabel(l, q) + ' - ' : '') + money(price)
    + (q.showUnit && unitPrice(l, price, q) ? ' (' + unitPrice(l, price, q) + ')' : '');

  if (!priced.length) {
    groups.forEach(({ g, lines }) => block(g, lines.map(l => row(l, calcLine(l).price))));
  } else if (q.optMode === 'addons') {
    const defaults = priced.map(o => o.choices[0].name.trim()).filter(Boolean);
    groups.forEach(({ g, lines }) =>
      block([g, ...defaults].filter(Boolean).join(' · '), lines.map(l => row(l, calcLine(l).price))));
    const allLines = groups.flatMap(x => x.lines);
    priced.forEach(o => o.choices.slice(1).forEach(c => {
      if (!c.name.trim()) return;
      const vals = allLines.map(l => ({ l, r: addon(c, l.id).r }));
      const header = o.name.trim() + ': ' + c.name.trim();
      if (vals.every(x => x.r === vals[0].r)) {
        block(header, [vals[0].r ? moneyAdd(vals[0].r) + ' (qualquer quantidade)' : 'Sem custo adicional']);
      } else {
        block(header, vals.map(x => (qtyLabel(x.l, q) ? qtyLabel(x.l, q) + ' - ' : '') + (x.r ? moneyAdd(x.r) : 'sem custo')));
      }
    }));
  } else {
    combos(priced).forEach(combo => {
      groups.forEach(({ g, lines }) => {
        const header = [g, ...combo.map(c => c.name.trim())].filter(Boolean).join(' · ');
        block(header, lines.map(l => row(l, comboPrice(l, combo).price)));
      });
    });
  }

  const notes = q.notes.filter(n => !n.internal && n.text.trim()).map(n => n.text.trim());
  const tail = [];
  if (q.freeShip) tail.push('Frete grátis');
  const t = q.turnaround.trim();
  if (t) tail.push('Prazo: ' + (/^[\d\s\-–a]+$/.test(t) ? t + SUFFIX : t));
  if (notes.length) { if (L.length) L.push(''); L.push(...notes); }
  if (tail.length) { if (L.length) L.push(''); L.push(...tail); }
  return L.join('\n');
}
const allText = () => quotes.map(quoteText).filter(Boolean).join('\n\n___\n\n');

/* ---------- Render ---------- */
function lineHTML(l, li, qi) {
  return `
  <div class="line" data-l="${li}">
    <div class="line-top">
      <input type="text" data-lf="group" list="groups-${qi}" value="${esc(l.group)}"
        placeholder="Option label (optional) — e.g. Spot UV só na frente">
      <button class="x-btn" data-act="dell" title="Remove line">×</button>
    </div>
    <div class="line-row">
      <div class="field"><label>Qty</label>
        <input type="text" inputmode="numeric" data-lf="qty" value="${esc(l.qty)}" placeholder="100"></div>
      <div class="field"><label>Vendor</label>
        <div class="input-wrap"><span class="dollar">$</span>
        <input type="number" data-lf="vc" value="${esc(l.vc)}" placeholder="0.00"></div></div>
      <div class="field"><label>Shipping</label>
        <div class="input-wrap"><span class="dollar">$</span>
        <input type="number" data-lf="sh" value="${esc(l.sh)}" placeholder="0.00"></div></div>
      <div class="field"><label>Override</label>
        <div class="input-wrap dashed"><span class="dollar">$</span>
        <input type="number" data-lf="ov" value="${esc(l.ov)}" placeholder="auto"></div></div>
    </div>
    <div class="line-result"></div>
  </div>`;
}

function optionHTML(o, oi, q) {
  const cols = q.lines;
  const rows = o.choices.map((c, ci) => {
    if (ci === 0) return `<tr data-ch="0">
      <td><input type="text" data-chf="name" value="${esc(c.name)}" placeholder="Default — e.g. Square (Standard)"></td>
      ${cols.map(() => '<td class="def">default · $0</td>').join('')}<td></td></tr>`;
    return `<tr data-ch="${ci}">
      <td><input type="text" data-chf="name" value="${esc(c.name)}" placeholder="e.g. Rounded"></td>
      ${cols.map(l => {
        const cell = (c.add || {})[l.id] || {};
        return `<td class="cell">
          <div class="input-wrap"><span class="dollar">$</span>
            <input type="number" data-add="v" data-line="${l.id}" value="${esc(cell.v || '')}" placeholder="vendor +"></div>
          <div class="input-wrap dashed"><span class="dollar">$</span>
            <input type="number" data-add="o" data-line="${l.id}" value="${esc(cell.o || '')}" placeholder="auto"></div>
        </td>`;
      }).join('')}
      <td><button class="x-btn" data-act="delch" title="Remove choice">×</button></td></tr>`;
  }).join('');
  return `
  <div class="opt" data-o="${oi}">
    <div class="opt-top">
      <input type="text" data-of="name" value="${esc(o.name)}" placeholder="Option name — e.g. Cantos / Foil">
      <button class="x-btn" data-act="delo" title="Remove option">×</button>
    </div>
    <div class="opt-table-wrap"><table class="opt-table">
      <thead><tr><th>Choice</th>${cols.map(l => `<th data-colhead="${l.id}"></th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="opt-legend">Top box: extra vendor cost · Bottom box: your add-on price (empty = auto)</div>
    <button class="text-btn" data-act="addch">+ Add choice</button>
  </div>`;
}

function quoteHTML(q, qi) {
  const inCat = q.catalogId && catalog.some(c => c.id === q.catalogId);
  const specFields = SPECS.map(([k, label, ph]) => `
    <div class="field"><label>${label}</label>
      <input type="text" data-f="${k}" value="${esc(q[k])}" placeholder="${esc(ph)}"></div>`).join('');
  const custom = q.custom.map((c, ci) => `
    <div class="custom-row" data-c="${ci}">
      <input type="text" data-cf="label" value="${esc(c.label)}" placeholder="Label (ex: Cantos)">
      <input type="text" data-cf="value" value="${esc(c.value)}" placeholder="Value (ex: Arredondados)">
      <button class="x-btn" data-act="delc" title="Remove">×</button>
    </div>`).join('');
  const notes = q.notes.map((n, ni) => `
    <div class="note-row${n.internal ? ' internal' : ''}" data-n="${ni}">
      <input type="text" data-nf="text" value="${esc(n.text)}" placeholder="${n.internal ? 'Internal note (not sent to client)' : 'e.g. Arte inclusa no preço'}">
      <label class="check small"><input type="checkbox" data-nf="internal" ${n.internal ? 'checked' : ''}> Internal</label>
      <button class="x-btn" data-act="deln" title="Remove note">×</button>
    </div>`).join('');

  const actions = q.collapsed
    ? `<div class="q-actions">
        <button data-act="copy">Copy</button>
        ${quotes.length > 1 ? '<button data-act="delq" class="x-btn" title="Remove from quote">×</button>' : ''}
      </div>`
    : `<div class="q-actions">
        <button data-act="catsave" class="primary">${inCat ? 'Update catalog' : 'Save to catalog'}</button>
        <button data-act="dup">Duplicate</button>
        ${quotes.length > 1 ? '<button data-act="delq" class="danger">Remove</button>' : ''}
      </div>`;

  return `
  <div class="quote${q.collapsed ? ' collapsed' : ''}" data-q="${qi}">
    <div class="q-head" data-act="toggle">
      <div class="q-left">
        <span class="chev">▶</span>
        <div class="q-meta">
          <span class="q-num">Product ${qi + 1}${inCat ? '<span class="in-cat">in catalog</span>' : ''}</span>
          <div class="q-title"></div>
          <div class="q-sum"></div>
        </div>
      </div>
      ${actions}
    </div>
    <div class="q-body">
      <div class="grid2 cat-row">
        <div class="field"><label>Main category</label>
          <input type="text" data-f="cat" list="dl-cats" value="${esc(q.cat)}" placeholder="e.g. Business Cards"></div>
        <div class="field"><label>Subcategory</label>
          <input type="text" data-f="sub" list="dl-subs-${qi}" value="${esc(q.sub)}" placeholder="e.g. Premium Business Cards"></div>
      </div>
      <datalist id="dl-subs-${qi}"></datalist>

      <div class="field"><label>Product name</label>
        <input type="text" data-f="title" value="${esc(q.title)}" placeholder="Raised Spot UV Business Cards"></div>

      <div class="grid2">
        ${specFields}
        <div class="field"><label>Turnaround</label>
          <input type="text" data-f="turnaround" value="${esc(q.turnaround)}" placeholder="5-8">
          <div class="suffix-hint">Só números (5-8) → adiciona "${SUFFIX.trim()}"</div></div>
      </div>
      ${custom}
      <div class="q-tools">
        <button class="text-btn" data-act="addc">+ Custom spec</button>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <label class="check"><input type="checkbox" data-f="showUnit" ${q.showUnit ? 'checked' : ''}> Preço por unidade</label>
          <label class="check"><input type="checkbox" data-f="freeShip" ${q.freeShip ? 'checked' : ''}> Frete grátis</label>
        </div>
      </div>

      <div class="int-box">
        <div class="int-head">Internal only · never shown to the client</div>
        <div class="grid2">
          <div class="field"><label>Vendor (where this price came from)</label>
            <input type="text" data-f="vendor" list="dl-vendors" value="${esc(q.vendor)}" placeholder="e.g. YMQ"></div>
          <div class="field"><label>Memo</label>
            <textarea data-f="memo" rows="2" placeholder="e.g. price checked 11/03, item #, contact…">${esc(q.memo)}</textarea></div>
        </div>
        <datalist id="dl-vendors">${[...new Set(catalog.map(c => (c.data.vendor || '').trim()).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('')}</datalist>
      </div>

      <div class="section-title">Pricing</div>
      <div class="grid3">
        <div class="field"><label>Unit name</label>
          <input type="text" data-f="unitName" value="${esc(q.unitName)}" placeholder="un"></div>
        <div class="field"><label>Pieces per unit</label>
          <input type="number" data-f="perUnit" value="${esc(q.perUnit)}" placeholder="—"></div>
        <div class="field"><label>Piece name</label>
          <input type="text" data-f="pieceName" value="${esc(q.pieceName)}" placeholder="etiqueta"></div>
      </div>
      <div class="suffix-hint" style="margin:4px 0 10px">Para folhas/kits: folhas · 5 · etiqueta → "50 folhas (250 etiquetas)" e preço por etiqueta. Deixe vazio para "un".</div>
      <datalist id="groups-${qi}"></datalist>
      ${q.lines.map((l, li) => lineHTML(l, li, qi)).join('')}
      <button class="add-line" data-act="addl">+ Add price line</button>

      <div class="section-title">Price options (variants)</div>
      <div class="section-hint">Ex: Cantos, Foil coverage. A primeira escolha é o padrão ($0). Opções sem valor (ex: cor do foil) viram uma linha de spec.</div>
      ${q.options.map((o, oi) => optionHTML(o, oi, q)).join('')}
      <button class="add-line" data-act="addo">+ Add price option</button>
      <div class="mode-row" data-moderow>
        <span>Quote shows</span>
        <select data-f="optMode">
          <option value="combos" ${q.optMode !== 'addons' ? 'selected' : ''}>Every combination (full prices)</option>
          <option value="addons" ${q.optMode === 'addons' ? 'selected' : ''}>Base price + add-ons</option>
        </select>
      </div>
      <div class="matrix" data-matrix></div>

      <div class="section-title">Notes</div>
      ${notes}
      <div class="q-tools" style="margin-top:${q.notes.length ? 8 : 0}px">
        <button class="text-btn" data-act="addn">+ Add note</button>
        <span class="suffix-hint" style="margin:0">Internal notes stay out of the WhatsApp text</span>
      </div>

      <div class="section-title">Mockups</div>
      <div class="mock-grid">${q.images.map(im => mockHTML(im, true)).join('')}</div>
      <label class="drop" data-drop>+ Upload mockup <span>— or drag & drop / paste (Ctrl+V)</span>
        <input type="file" accept="image/*,application/pdf" multiple data-upload hidden></label>

      <div class="output">
        <div class="out-head">
          <span>WhatsApp preview</span>
          <div>
            <button class="ghost" data-act="save">Save to log</button>
            <button data-act="copy">Copy</button>
          </div>
        </div>
        <div class="out-text"></div>
      </div>
    </div>
  </div>`;
}

function render() {
  setTimeout(() => hydrateImages(wrap), 0);
  document.getElementById('dl-cats').innerHTML = Object.keys(categories).map(c => `<option value="${esc(c)}">`).join('');
  wrap.innerHTML = quotes.map(quoteHTML).join('');
  update();
}

function matrixHTML(q, priced) {
  const lines = q.lines.filter(l => calcLine(l));
  if (!lines.length) return '';
  const head = `<tr><th>Combination</th>${lines.map(l => `<th>${esc(lineLabel(l, q.lines.indexOf(l)))}</th>`).join('')}</tr>`;
  const body = combos(priced).map(combo => `<tr><td>${esc(combo.map(c => c.name.trim() || '(default)').join(' · '))}</td>${
    lines.map(l => {
      const p = comboPrice(l, combo);
      const cls = p.margin >= 40 ? 'm-green' : p.margin >= 30 ? 'm-yellow' : 'm-red';
      return `<td><b>${money(p.price)}</b><small class="${cls}">${p.margin.toFixed(0)}%</small></td>`;
    }).join('')}</tr>`).join('');
  return `<table>${head}${body}</table>`;
}

function update() {
  quotes.forEach((q, qi) => {
    const qEl = wrap.querySelector(`[data-q="${qi}"]`);
    if (!qEl) return;
    q.lines.forEach((l, li) => {
      const box = qEl.querySelector(`[data-l="${li}"] .line-result`);
      const r = calcLine(l);
      if (!r) { box.classList.remove('show'); box.innerHTML = ''; return; }
      box.innerHTML =
        `<span class="lr-price">${money(r.price)}</span>` +
        (r.hasOv ? '<span class="override-tag">overridden</span>' : '') +
        `<span class="lr-margin ${marginClass(r.margin)}">${r.margin.toFixed(1)}%</span>` +
        `<span>cost $${(r.vc + r.sh).toFixed(2)} · profit $${r.profit.toFixed(2)}` +
        (unitPrice(l, r.price, q) ? ` · ${unitPrice(l, r.price, q)}` : '') +
        (r.hasOv ? ` · auto ${money(r.auto)}` : '') + `</span>`;
      box.classList.add('show');
    });

    // Option table headers + auto add-on hints
    q.lines.forEach((l, li) => qEl.querySelectorAll(`[data-colhead="${l.id}"]`).forEach(th => th.textContent = lineLabel(l, li)));
    qEl.querySelectorAll('[data-add="o"]').forEach(inp => {
      const o = q.options[+inp.closest('[data-o]').dataset.o];
      const c = o.choices[+inp.closest('[data-ch]').dataset.ch];
      const a = addon(c, inp.dataset.line);
      inp.placeholder = a.auto ? 'auto +$' + a.auto : 'auto';
    });
    const priced = pricedOptions(q);
    qEl.querySelector('[data-moderow]').style.display = priced.length ? 'flex' : 'none';
    qEl.querySelector('[data-matrix]').innerHTML = priced.length ? matrixHTML(q, priced) : '';

    const catKey = findKey(categories, q.cat || '');
    qEl.querySelector(`#dl-subs-${qi}`).innerHTML = (catKey ? categories[catKey] : []).map(s => `<option value="${esc(s)}">`).join('');

    qEl.querySelector('.q-title').textContent = q.title.trim() || 'Untitled product';
    qEl.querySelector('.q-sum').textContent = quoteSummary(q);
    const out = qEl.querySelector('.out-text');
    const txt = quoteText(q);
    out.textContent = txt || 'Fill in the fields to build the quote…';
    out.classList.toggle('empty', !txt);

    const groups = [...new Set(q.lines.map(l => l.group.trim()).filter(Boolean))];
    qEl.querySelector(`#groups-${qi}`).innerHTML = groups.map(g => `<option value="${esc(g)}">`).join('');
  });
  document.getElementById('copyAll').classList.toggle('show', quotes.filter(q => quoteText(q)).length > 1);
  store(DRAFT_KEY, quotes);
}

function priceRange(q) {
  const prices = (q.lines || []).map(calcLine).filter(Boolean).map(r => r.price);
  if (!prices.length) return '';
  const lo = Math.min(...prices), hi = Math.max(...prices);
  return money(lo) + (hi > lo ? '–' + money(hi) : '');
}
function quoteSummary(q) {
  const path = [q.cat, q.sub].map(s => (s || '').trim()).filter(Boolean).join(' › ');
  const parts = [path, q.finish, q.size].filter(s => (s || '').trim());
  const range = priceRange(q);
  parts.push(range ? range : 'no prices yet');
  const n = pricedOptions(q).length;
  if (n) parts.push('+' + n + (n > 1 ? ' options' : ' option'));
  if (q.images.length) parts.push(q.images.length + (q.images.length > 1 ? ' mockups' : ' mockup'));
  return parts.join(' · ');
}

/* ---------- Events ---------- */
function onInput(e) {
  const t = e.target, qEl = t.closest('[data-q]');
  if (!qEl) return;
  const q = quotes[+qEl.dataset.q];
  if ('upload' in t.dataset) { if (e.type === 'change') { addFiles(q, t.files); t.value = ''; } return; }
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.f) q[t.dataset.f] = val;
  else if (t.dataset.lf) q.lines[+t.closest('[data-l]').dataset.l][t.dataset.lf] = val;
  else if (t.dataset.cf) q.custom[+t.closest('[data-c]').dataset.c][t.dataset.cf] = val;
  else if (t.dataset.nf) {
    const n = q.notes[+t.closest('[data-n]').dataset.n];
    n[t.dataset.nf] = val;
    if (t.dataset.nf === 'internal') t.closest('.note-row').classList.toggle('internal', val);
  }
  else if (t.dataset.of) q.options[+t.closest('[data-o]').dataset.o].name = val;
  else if (t.dataset.chf) q.options[+t.closest('[data-o]').dataset.o].choices[+t.closest('[data-ch]').dataset.ch].name = val;
  else if (t.dataset.add) {
    const c = q.options[+t.closest('[data-o]').dataset.o].choices[+t.closest('[data-ch]').dataset.ch];
    c.add = c.add || {};
    (c.add[t.dataset.line] = c.add[t.dataset.line] || {})[t.dataset.add] = val;
  }
  update();
}
wrap.addEventListener('input', onInput);
wrap.addEventListener('change', onInput);

wrap.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset.lf) return;
  const qEl = e.target.closest('[data-q]'), q = quotes[+qEl.dataset.q];
  if (+e.target.closest('[data-l]').dataset.l === q.lines.length - 1) addLine(+qEl.dataset.q);
});

wrap.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const qi = +b.closest('[data-q]').dataset.q, q = quotes[qi], act = b.dataset.act;
  const oi = b.closest('[data-o]') ? +b.closest('[data-o]').dataset.o : -1;

  if (act === 'toggle') {
    const opening = q.collapsed;
    if (opening) quotes.forEach(o => o.collapsed = true);
    q.collapsed = !opening;
    render();
    if (opening) wrap.querySelector(`[data-q="${qi}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (act === 'copy') return copyText(quoteText(q), b);
  if (act === 'save') return saveQuote(q, b);
  if (act === 'addl') return addLine(qi);
  if (act === 'catsave') return saveToCatalog(qi);

  let focusSel = null;
  if (act === 'dup') {
    const copy = JSON.parse(JSON.stringify(q));
    delete copy.catalogId;
    quotes.forEach(o => o.collapsed = true);
    copy.collapsed = false;
    quotes.splice(qi + 1, 0, copy);
  }
  if (act === 'delq') { quotes.splice(qi, 1); setTimeout(gcImages, 0); }
  if (act === 'addc') { q.custom.push({ label: '', value: '' }); focusSel = `[data-q="${qi}"] .custom-row:last-of-type input`; }
  if (act === 'delc') q.custom.splice(+b.closest('[data-c]').dataset.c, 1);
  if (act === 'addn') { q.notes.push({ text: '', internal: false }); focusSel = `[data-q="${qi}"] [data-n="${q.notes.length - 1}"] input`; }
  if (act === 'deln') q.notes.splice(+b.closest('[data-n]').dataset.n, 1);
  if (act === 'addo') { q.options.push(newOption()); focusSel = `[data-q="${qi}"] [data-o="${q.options.length - 1}"] [data-of]`; }
  if (act === 'delo') q.options.splice(oi, 1);
  if (act === 'addch') {
    q.options[oi].choices.push(newChoice());
    focusSel = `[data-q="${qi}"] [data-o="${oi}"] [data-ch="${q.options[oi].choices.length - 1}"] [data-chf]`;
  }
  if (act === 'delch') {
    q.options[oi].choices.splice(+b.closest('[data-ch]').dataset.ch, 1);
    if (q.options[oi].choices.length < 2) q.options[oi].choices.push(newChoice());
  }
  if (act === 'dell') {
    q.lines.splice(+b.closest('[data-l]').dataset.l, 1);
    if (!q.lines.length) q.lines.push(newLine());
  }
  render();
  if (act === 'dup') wrap.querySelector(`[data-q="${qi + 1}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (focusSel) { const el = wrap.querySelector(focusSel); if (el) el.focus(); }
});

function addLine(qi) {
  const q = quotes[qi], last = q.lines[q.lines.length - 1];
  q.lines.push(newLine(last ? last.group : ''));
  render();
  wrap.querySelector(`[data-q="${qi}"] [data-l="${q.lines.length - 1}"] [data-lf="qty"]`).focus();
}

function collapseAll() { quotes.forEach(q => q.collapsed = true); render(); }

function addQuote() {
  quotes.forEach(q => q.collapsed = true);
  quotes.push(newQuote());
  render();
  const el = wrap.querySelector(`[data-q="${quotes.length - 1}"]`);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.querySelector('[data-f="cat"]').focus({ preventScroll: true });
}

function resetAll() {
  if (!confirm('Clear all products and start a new quote? (Catalog and log stay.)')) return;
  quotes = [newQuote()];
  render();
  gcImages();
}

function copyText(text, btn) {
  if (!text) return;
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = o, 1400); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove(); done();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/* ---------- Log ---------- */
function saveQuote(q, btn) {
  const time = new Date().toLocaleString();
  const items = [];
  q.lines.forEach(l => {
    const r = calcLine(l);
    if (!r) return;
    const note = [q.title.trim(), l.group.trim(), qtyLabel(l, q), r.hasOv ? 'override' : ''].filter(Boolean).join(' · ');
    items.push({ vendorCost: r.vc, shipping: r.sh, rule: '÷ 0.53', final: r.price, margin: r.margin, note, time });
  });
  if (!items.length) return;
  logItems = items.concat(logItems);
  store(LOG_KEY, logItems); renderLog();
  const o = btn.textContent; btn.textContent = 'Saved ✓'; setTimeout(() => btn.textContent = o, 1400);
}
function clearLog() { logItems = []; store(LOG_KEY, logItems); renderLog(); }
function removeItem(i) { logItems.splice(i, 1); store(LOG_KEY, logItems); renderLog(); }

function renderLog() {
  const section = document.getElementById('logSection');
  if (!logItems.length) { section.classList.remove('show'); return; }
  section.classList.add('show');
  document.getElementById('logList').innerHTML = logItems.map((r, i) => {
    const c = r.margin >= 40 ? '#2D5E4A' : r.margin >= 30 ? '#b45309' : '#dc2626';
    const price = r.final % 1 ? r.final.toFixed(2) : r.final.toFixed(0);
    return `<div class="log-item"><div>
      <strong>Vendor $${r.vendorCost.toFixed(2)}</strong>
      ${r.shipping > 0 ? `<span style="color:#888"> + $${r.shipping.toFixed(2)} ship</span>` : ''}
      ${r.note ? `<span class="note">(${esc(r.note)})</span>` : ''}
    </div><div style="display:flex;align-items:center;gap:6px">
      <span class="log-price">$${price}</span>
      <span class="log-margin" style="color:${c}">${r.margin.toFixed(0)}%</span>
      <button onclick="removeItem(${i})" class="x-btn" style="font-size:16px" title="Remove">×</button>
    </div></div>`;
  }).join('');
}

/* ---------- Catalog ---------- */
// Products live in the shared database (Supabase); this browser keeps a copy for when you're offline.
let cloudSnap = null, cloudCats = null;
const snapOf = list => Object.fromEntries(list.map(c => [c.id, JSON.stringify(c)]));
function persistCatalog() {
  store(CATALOG_KEY, catalog);
  store(CATS_KEY, categories);
  if (!cloudSnap) return Promise.resolve(false);
  const now = snapOf(catalog), prev = cloudSnap;
  const ups = catalog.filter(c => now[c.id] !== prev[c.id]).map(c => ({ id: c.id, data: c }));
  const dels = Object.keys(prev).filter(id => !(id in now));
  const catsJson = JSON.stringify(categories), catsChanged = catsJson !== cloudCats;
  if (!ups.length && !dels.length && !catsChanged) return Promise.resolve(true);
  const usedNow = new Set(catalog.flatMap(c => (c.data.images || []).map(im => im.id)));
  const goneImgs = dels.flatMap(id => { try { return (JSON.parse(prev[id]).data.images || []).map(im => im.id); } catch (e) { return []; } }).filter(id => !usedNow.has(id));
  return uploadCatalogImages(ups.map(u => u.data)).then(() => TBDCloud.write(async sb => {
    if (goneImgs.length) await sb.storage.from('photos').remove(goneImgs.map(cloudImgPath));
    if (ups.length) { const r = await sb.from('print_products').upsert(ups); if (r.error) return r; }
    if (dels.length) { const r = await sb.from('print_products').delete().in('id', dels); if (r.error) return r; }
    if (catsChanged) { const r = await sb.from('settings').upsert({ key: 'print_categories', value: categories }); if (r.error) return r; }
    cloudSnap = now; cloudCats = catsJson;
    return {};
  }));
}
// Only edit the catalog when logged in, so every device sees the same products.
function needLogin() {
  if (TBDCloud.loggedIn && cloudSnap) return false;
  alert(TBDCloud.loggedIn ? 'Os produtos ainda estão carregando. Tente de novo em alguns segundos.' : 'Você precisa entrar (login) no topo da página para salvar ou apagar produtos do catálogo.');
  return true;
}
TBDCloud.onLoad(async () => {
  const [prods, cats] = await Promise.all([
    TBDCloud.sb.from('print_products').select('id,data').limit(5000),
    TBDCloud.sb.from('settings').select('value').eq('key', 'print_categories').maybeSingle(),
  ]);
  if (prods.error) throw prods.error;
  if (cats.error) throw cats.error;
  catalog = (prods.data || []).map(r => r.data).filter(c => c && c.id && c.data)
    .sort((a, b) => (b.updated || 0) - (a.updated || 0));
  categories = Object.assign({}, SEED_CATS, (cats.data && cats.data.value) || {});
  catalog.forEach(c => addCategory(c.data.cat, c.data.sub, true));
  cloudSnap = snapOf(catalog);
  cloudCats = JSON.stringify(categories);
  store(CATALOG_KEY, catalog); store(CATS_KEY, categories);
  render(); renderCatalog();
  uploadCatalogImages(catalog).catch(() => {}); // first time on a computer that has the mockups: put them online
});

// ── Open products (draft) online, so the same list shows up on every device ──
const DRAFT_ID = 'pricing-draft';
const draftJSON = () => JSON.stringify(quotes.map(q => { const c = { ...q }; delete c.collapsed; return c; }));
let draftSaved = null, draftLocal = draftJSON(), draftLoaded = false;
const draftBlank = () => quotes.every(isBlank);
async function saveDraft() {
  const js = draftJSON();
  if (js !== draftLocal) { draftLocal = js; store(DRAFT_T_KEY, Date.now()); }
  if (!TBDCloud.loggedIn || !draftLoaded || js === draftSaved) return;
  const blank = draftBlank();
  const ok = await TBDCloud.write(async sb => {
    if (blank) return await sb.from('open_quotes').delete().eq('id', DRAFT_ID);
    const up = await uploadCatalogImages(quotes.map(q => ({ data: q })));
    if (!up) return { error: { message: 'image upload failed' } };
    return await sb.from('open_quotes').upsert({ id: DRAFT_ID, app: 'pricing', data: { quotes: JSON.parse(js) } });
  });
  if (ok) draftSaved = js;
}
TBDCloud.onLoad(async () => {
  if (draftLoaded) return;
  const sb = TBDCloud.sb, cutoff = new Date(Date.now() - DRAFT_DAYS * 86400000).toISOString();
  await sb.from('open_quotes').delete().eq('id', DRAFT_ID).lt('updated_at', cutoff);
  const { data, error } = await sb.from('open_quotes').select('data,updated_at').eq('id', DRAFT_ID).maybeSingle();
  if (error) throw error;
  const localT = load(DRAFT_T_KEY, 0);
  if (data && data.data && Array.isArray(data.data.quotes)) {
    const remoteJs = JSON.stringify(data.data.quotes), remoteT = Date.parse(data.updated_at) || 0;
    draftSaved = remoteJs;
    // The newer list wins: the one saved online, unless this device changed its list later.
    if (remoteJs !== draftJSON() && (draftBlank() || remoteT >= localT)) {
      quotes = data.data.quotes.map(q => normalize({ ...q, collapsed: true }));
      draftLocal = draftJSON(); store(DRAFT_KEY, quotes); store(DRAFT_T_KEY, remoteT);
      render();
    }
  }
  draftLoaded = true;
  saveDraft();
});
setInterval(() => { saveDraft().catch(() => {}); }, 3000);
window.addEventListener('pagehide', () => { try { saveDraft(); } catch (e) {} });

function isBlank(q) {
  return !q.title.trim() && !q.cat.trim() && SPECS.every(([k]) => !(q[k] || '').trim()) && !q.turnaround.trim()
    && !q.custom.length && !q.notes.length && !q.options.length && q.lines.every(l => !l.vc && !l.qty && !l.group);
}

function saveToCatalog(qi) {
  if (needLogin()) return;
  const q = quotes[qi];
  if (!q.title.trim()) { alert('Give the product a name before saving it to the catalog.'); return; }
  const norm = addCategory(q.cat, q.sub);
  q.cat = norm.cat; q.sub = norm.sub;
  if (q.cat) openGroups.add(q.cat);
  const data = JSON.parse(JSON.stringify(q));
  delete data.catalogId; delete data.collapsed;
  q.collapsed = true;
  const existing = q.catalogId && catalog.find(c => c.id === q.catalogId);
  if (existing) { existing.data = data; existing.updated = Date.now(); }
  else {
    q.catalogId = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    catalog.unshift({ id: q.catalogId, data, updated: Date.now() });
  }
  persistCatalog();
  render();
  renderCatalog();
}

function loadFromCatalog(id, openIt) {
  const item = catalog.find(c => c.id === id);
  if (!item) return;
  const q = normalize(Object.assign(JSON.parse(JSON.stringify(item.data)), { catalogId: id, collapsed: !openIt }));
  quotes.forEach(o => o.collapsed = true);
  if (quotes.length === 1 && isBlank(quotes[0])) quotes = [q];
  else quotes.push(q);
  render();
  wrap.querySelector(`[data-q="${quotes.length - 1}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function deleteFromCatalog(id) {
  if (needLogin()) return;
  const item = catalog.find(c => c.id === id);
  if (!item || !confirm('Delete "' + item.data.title + '" from the catalog?')) return;
  catalog = catalog.filter(c => c.id !== id);
  persistCatalog();
  render();
  renderCatalog();
  gcImages();
}

const openItems = new Set();

function mCls(m) { return m >= 40 ? 'm-green' : m >= 30 ? 'm-yellow' : 'm-red'; }

function catDetailHTML(d) {
  const q = normalize(JSON.parse(JSON.stringify(d)));
  const text = quoteText(q);
  const lines = q.lines.filter(l => calcLine(l));
  const priced = pricedOptions(q);
  let table = '';
  if (lines.length) {
    table = `<div class="cd-label">Prices & margins</div><div class="cd-table"><table>
      <tr><th>Qty</th><th>Vendor</th><th>Ship</th><th>Price</th></tr>
      ${lines.map((l, i) => {
        const r = calcLine(l);
        return `<tr><td>${esc(lineLabel(l, q.lines.indexOf(l)))}</td><td>${money(r.vc)}</td><td>${r.sh ? money(r.sh) : '—'}</td>
          <td><b>${money(r.price)}</b><small class="${mCls(r.margin)}">${r.margin.toFixed(0)}%</small>${r.hasOv ? ' <small style="color:#b45309">override</small>' : ''}</td></tr>`;
      }).join('')}
    </table></div>`;
    if (priced.length) table += `<div class="cd-label">All combinations</div><div class="cd-table">${
      matrixHTML(q, priced)}</div>`;
  }
  const internal = q.notes.filter(n => n.internal && n.text.trim());
  const vend = (q.vendor || '').trim(), memo = (q.memo || '').trim();
  return `
    ${vend || memo ? `<div class="cd-label">Vendor · internal</div><div class="cd-internal">${vend ? '<b>' + esc(vend) + '</b>' : ''}${vend && memo ? '<br>' : ''}${esc(memo).replace(/\n/g, '<br>')}</div>` : ''}
    <div class="cd-label">Quote text</div>
    <div class="cd-text">${esc(text) || '<i style="color:#aaa">Empty</i>'}</div>
    ${q.images.length ? `<div class="cd-label">Mockups</div><div class="mock-grid">${q.images.map(im => mockHTML(im, false)).join('')}</div>` : ''}
    ${table}
    ${internal.length ? `<div class="cd-label">Internal notes</div><div class="cd-internal">${internal.map(n => esc(n.text)).join('<br>')}</div>` : ''}`;
}

function toggleCatItem(id) {
  if (openItems.has(id)) openItems.delete(id); else openItems.add(id);
  renderCatalog();
}

function copyCatItem(id, btn) {
  const item = catalog.find(c => c.id === id);
  if (item) copyText(quoteText(normalize(JSON.parse(JSON.stringify(item.data)))), btn);
}

function catItemHTML(c) {
  const d = c.data;
  const sub = [d.finish, d.size].filter(s => (s || '').trim()).join(' · ');
  const range = priceRange(d) || 'no prices';
  const n = pricedOptions(normalize(JSON.parse(JSON.stringify(d)))).length;
  const imgs = (d.images || []).length;
  const open = openItems.has(c.id);
  return `<div class="cat-card${open ? ' open' : ''}">
    <div class="cat-item">
      <div class="cat-info" onclick="toggleCatItem('${c.id}')" title="Show details">
        <span class="cat-chev">▶</span>
        <div style="min-width:0">
          <div class="cat-title">${esc(d.title)}${(d.vendor || '').trim() ? ` <span class="vend-tag">${esc(d.vendor)}</span>` : ''}</div>
          <div class="cat-sub">${esc(sub || '—')} · ${range}${n ? ' · +' + n + (n > 1 ? ' options' : ' option') : ''}${imgs ? ' · ' + imgs + (imgs > 1 ? ' mockups' : ' mockup') : ''}</div>
        </div>
      </div>
      <div class="cat-actions">
        <button class="cat-add" onclick="loadFromCatalog('${c.id}')">+ Add</button>
        <button class="x-btn" onclick="deleteFromCatalog('${c.id}')" title="Delete">×</button>
      </div>
    </div>
    ${open ? `<div class="cat-detail">${catDetailHTML(d)}
      <div class="cd-actions">
        <button onclick="copyCatItem('${c.id}', this)">Copy quote text</button>
        <button class="primary" onclick="loadFromCatalog('${c.id}', true)">Add to quote / edit</button>
      </div></div>` : ''}
  </div>`;
}

function renderCatalog() {
  setTimeout(() => hydrateImages(document.getElementById('catList')), 0);
  const term = document.getElementById('catSearch').value.trim().toLowerCase();
  document.getElementById('catCount').textContent = catalog.length ? '(' + catalog.length + ')' : '';
  const list = document.getElementById('catList');
  if (!catalog.length) {
    list.innerHTML = '<div class="cat-empty">No products saved yet. Fill in a product and click "Save to catalog".</div>';
    return;
  }
  const items = catalog.filter(c => !term || JSON.stringify(c.data).toLowerCase().includes(term));
  if (!items.length) { list.innerHTML = '<div class="cat-empty">No matches.</div>'; return; }

  const UNCAT = 'Uncategorized';
  const byCat = {};
  items.forEach(c => {
    const cat = (c.data.cat || '').trim() || UNCAT, sub = (c.data.sub || '').trim();
    ((byCat[cat] = byCat[cat] || {})[sub] = byCat[cat][sub] || []).push(c);
  });
  const order = Object.keys(categories).filter(k => byCat[k])
    .concat(Object.keys(byCat).filter(k => !categories[k] && k !== UNCAT))
    .concat(byCat[UNCAT] ? [UNCAT] : []);

  list.innerHTML = order.map(cat => {
    const subs = byCat[cat];
    const count = Object.values(subs).reduce((n, a) => n + a.length, 0);
    const subOrder = Object.keys(subs).sort((a, b) => (a === '') - (b === '') || a.localeCompare(b)).sort((a, b) => (a !== '') - (b !== ''));
    const body = subOrder.map(s =>
      (s ? `<div class="cat-subhead">${esc(s)}</div>` : '') + subs[s].map(catItemHTML).join('')).join('');
    const open = term || openGroups.has(cat) || order.length === 1;
    return `<details class="cat-group" data-cat="${esc(cat)}" ${open ? 'open' : ''}>
      <summary><span class="sum-l">${esc(cat)}</span><span class="count">${count}</span></summary>
      <div class="cat-group-body">${body}</div>
    </details>`;
  }).join('');
}
document.getElementById('catList').addEventListener('toggle', e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.cat || document.getElementById('catSearch').value.trim()) return;
  if (d.open) openGroups.add(d.dataset.cat); else openGroups.delete(d.dataset.cat);
}, true);

async function exportCatalog() {
  const images = {};
  for (const c of catalog) for (const im of (c.data.images || [])) {
    if (images[im.id]) continue;
    const b = await idbGet(im.id);
    if (b) images[im.id] = { name: im.name, type: b.type, data: await blobToDataURL(b) };
  }
  const blob = new Blob([JSON.stringify({ catalog, categories, images, exported: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tbdezign-catalog-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importCatalog(input) {
  const file = input.files[0];
  if (!file) return;
  if (needLogin()) { input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (parsed.images && typeof parsed.images === 'object') {
        for (const [id, im] of Object.entries(parsed.images)) {
          if (im && im.data) await idbPut(id, dataURLToBlob(im.data));
        }
      }
      const incoming = Array.isArray(parsed) ? parsed : parsed.catalog;
      if (!Array.isArray(incoming)) throw new Error();
      if (parsed.categories && typeof parsed.categories === 'object') {
        Object.entries(parsed.categories).forEach(([cat, subs]) => {
          addCategory(cat, '', true);
          (subs || []).forEach(s => addCategory(cat, s, true));
        });
      }
      let added = 0, updated = 0;
      incoming.forEach(item => {
        if (!item || !item.id || !item.data) return;
        addCategory(item.data.cat, item.data.sub, true);
        const i = catalog.findIndex(c => c.id === item.id);
        // Products already in the catalog are kept as they are (the database copy wins); only new ones are added.
        // Same name + size + category counts as the same product even with a different id (re-created by hand).
        const sig = d => [d.title, d.size, d.cat, d.sub].map(v => String(v || '').trim().toLowerCase()).join('|');
        if (i >= 0 || catalog.some(c => sig(c.data) === sig(item.data))) updated++; else { catalog.push(item); added++; }
      });
      const saved = await persistCatalog();
      render();
      renderCatalog();
      alert('Import done: ' + added + ' added, ' + updated + ' already in the catalog (kept as they are). Mockup images restored.' + (saved ? '' : ' Atenção: não salvou no banco online.'));
    } catch (e) {
      alert('That file doesn\'t look like a catalog backup.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* ---------- Mockup images (stored in IndexedDB, not localStorage) ---------- */
let dbPromise = null;
function idb() {
  return dbPromise = dbPromise || new Promise((res, rej) => {
    const r = indexedDB.open('tbdezign-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('images');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbReq(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('images', mode), req = fn(tx.objectStore('images'));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const idbPut = (id, blob) => idbReq('readwrite', s => s.put(blob, id));
const idbGetLocal = id => idbReq('readonly', s => s.get(id)).catch(() => null);
// Mockups saved in the catalog also live online (Supabase Storage), so they show up on every device.
const cloudImgPath = id => 'print/' + id + '.img';
async function idbGet(id) {
  const b = await idbGetLocal(id);
  if (b || !TBDCloud.loggedIn) return b;
  try {
    const d = await TBDCloud.sb.storage.from('photos').download(cloudImgPath(id));
    if (d.error || !d.data) return null;
    try { await idbPut(id, d.data); } catch (e) {}
    return d.data;
  } catch (e) { return null; }
}
// Uploads the catalog's images that aren't online yet (only ones this browser has).
async function uploadCatalogImages(items) {
  if (!TBDCloud.loggedIn) return true;
  const ids = [...new Set(items.flatMap(c => (c.data.images || []).map(im => im.id)))];
  if (!ids.length) return true;
  const sb = TBDCloud.sb;
  const listed = await sb.storage.from('photos').list('print', { limit: 10000 });
  const online = new Set((listed.data || []).map(f => f.name));
  for (const id of ids) {
    if (online.has(id + '.img')) continue;
    const b = await idbGetLocal(id); if (!b) continue;
    const ok = await TBDCloud.write(sb => sb.storage.from('photos').upload(cloudImgPath(id), b, { upsert: true, contentType: b.type || 'image/png' }));
    if (!ok) return false;
  }
  return true;
}
const idbDel = id => idbReq('readwrite', s => s.delete(id));
const idbKeys = () => idbReq('readonly', s => s.getAllKeys());

const urlCache = new Map();
async function imageURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await idbGet(id);
  if (!b) return null;
  const u = URL.createObjectURL(b);
  urlCache.set(id, u);
  return u;
}
const isImage = im => /^image\//.test(im.type || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(im.name || '');

function mockHTML(im, editable) {
  const ext = (im.name || '').split('.').pop().toUpperCase();
  return `<div class="mock" data-im-id="${esc(im.id)}">
    <div class="thumb" data-mock="view">${isImage(im) ? `<img data-img-id="${esc(im.id)}" alt="">` : `<span class="file-tag">${esc(ext || 'FILE')}</span>`}</div>
    <div class="mname" title="${esc(im.name)}">${esc(im.name)}</div>
    <div class="mbtns">
      <button data-mock="dl">Download</button>
      ${isImage(im) ? '<button data-mock="copy">Copy</button>' : ''}
      ${editable ? '<button data-mock="del" title="Remove">×</button>' : ''}
    </div>
  </div>`;
}

function hydrateImages(root) {
  root.querySelectorAll('img[data-img-id]').forEach(async img => {
    const u = await imageURL(img.dataset.imgId);
    if (u) img.src = u;
    else img.closest('.thumb').innerHTML = '<span class="file-tag">missing</span>';
  });
}

async function addFiles(q, files) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type) || f.type === 'application/pdf');
  if (!list.length) return;
  try {
    for (const f of list) {
      const id = 'img' + Date.now().toString(36) + uid();
      await idbPut(id, f);
      q.images.push({ id, name: f.name || 'mockup.png', type: f.type });
    }
  } catch (e) {
    alert('Could not store the file in this browser.');
  }
  render();
}

async function gcImages() {
  try {
    const used = new Set();
    quotes.forEach(q => (q.images || []).forEach(im => used.add(im.id)));
    catalog.forEach(c => (c.data.images || []).forEach(im => used.add(im.id)));
    for (const k of await idbKeys()) if (!used.has(k)) {
      await idbDel(k);
      if (urlCache.has(k)) { URL.revokeObjectURL(urlCache.get(k)); urlCache.delete(k); }
    }
  } catch (e) {}
}

function blobToDataURL(b) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
}
function dataURLToBlob(d) {
  const [head, body] = d.split(',');
  const type = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(body), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

async function toPNG(blob) {
  if (blob.type === 'image/png') return blob;
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-mock]');
  if (!b) return;
  e.stopPropagation();
  const card = b.closest('[data-im-id]'), id = card.dataset.imId;
  const name = card.querySelector('.mname').textContent;
  const act = b.dataset.mock;
  if (act === 'del') {
    const q = quotes[+b.closest('[data-q]').dataset.q];
    q.images = q.images.filter(im => im.id !== id);
    render(); gcImages();
    return;
  }
  const url = await imageURL(id);
  if (!url) { alert('This file is no longer stored in this browser.'); return; }
  if (act === 'view') {
    if (card.querySelector('img')) {
      const lb = document.getElementById('lightbox');
      lb.querySelector('img').src = url; lb.classList.add('show');
    } else window.open(url, '_blank');
  }
  if (act === 'dl') {
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
  }
  if (act === 'copy') {
    try {
      const png = await toPNG(await idbGet(id));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
      const o = b.textContent; b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = o, 1400);
    } catch (err) {
      alert('This browser can\'t copy images — use Download instead.');
    }
  }
}, true);

// Drag & drop onto the upload box
wrap.addEventListener('dragover', e => {
  const d = e.target.closest('[data-drop]');
  if (d) { e.preventDefault(); d.classList.add('over'); }
});
wrap.addEventListener('dragleave', e => {
  const d = e.target.closest('[data-drop]');
  if (d) d.classList.remove('over');
});
wrap.addEventListener('drop', e => {
  const d = e.target.closest('[data-drop]');
  if (!d) return;
  e.preventDefault();
  addFiles(quotes[+d.closest('[data-q]').dataset.q], e.dataTransfer.files);
});
// Paste an image (Ctrl+V) → goes to the product that is open
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => /^image\//.test(f.type));
  if (!files.length) return;
  const qi = quotes.findIndex(q => !q.collapsed);
  if (qi < 0) return;
  e.preventDefault();
  addFiles(quotes[qi], files);
});

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

render();
renderLog();
renderCatalog();
</script>
<div id="lightbox" onclick="this.classList.remove('show')"><img alt=""></div>
</body>
